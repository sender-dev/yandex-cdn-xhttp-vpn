# Hardened CDN origin for a VLESS/XHTTP tunnel.
#
# Replace every CHANGE_ME value and the certificate paths before installing.
# Keep this file out of the public web root and back it up before editing.
#
# The CDN must send the same X-CDN-Secret header on every origin request:
#
#   yc cdn resource update <RESOURCE_ID> \
#     --static-request-headers X-CDN-Secret=<SECRET>
#
# Generate the secret with `openssl rand -hex 32`. Hex characters keep the
# regular expression below safe; do not use a value containing regex
# metacharacters. Header names may contain letters, digits, `-` and `_`.

# nginx joins duplicate header lines with ", ". Match the secret anywhere in
# the value instead of comparing for equality: a client that prepends a fake
# header through the CDN then cannot lock legitimate traffic out, while a
# direct scan of the origin still cannot guess the secret. A direct request
# with no header, or with a wrong one, gets `444` (connection closed).
map $http_x_cdn_secret $cdn_secret_ok {
    default 0;
    "~CHANGE_ME_CDN_SECRET" 1;
}

# Some edge requests arrive as OPTIONS. The XHTTP inbound expects POST for
# body-mode uplinks; rewriting OPTIONS to POST is harmless for GET/header.
map $request_method $xhttp_uplink_method {
    OPTIONS POST;
    default $request_method;
}

upstream xhttp_backend {
    server 127.0.0.1:9081;
    keepalive 32;
    # Let the CDN reuse one origin connection for many XHTTP requests.
    # nginx >= 1.15.3 supports these directives in the upstream block.
    keepalive_requests 100000;
    keepalive_timeout 600s;
}

server {
    # Drop `default_server` if another vhost already owns the default on :80.
    listen 80 default_server;
    server_name _;

    # Header placement base64-encodes the uplink. 3-4 KiB chunks stay well
    # below these buffers; the buffers are insurance against padding growth
    # and against headers the CDN adds on the way to the origin.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    keepalive_requests 100000;
    keepalive_timeout 600s;

    # HTTP-01 must stay reachable without the CDN secret.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Liveness stays open: the CDN edge and external monitoring use it.
    location = /health {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Deliberate control for the secret plumbing: 204 with the right header,
    # connection close (444) without it. The CDN injects the header, so this
    # path also proves the injection when requested through the CDN hostname.
    location = /_cdn_secret_probe {
        access_log off;
        if ($cdn_secret_ok = 0) { return 444; }
        return 204;
    }

    location /api-stream {
        if ($cdn_secret_ok = 0) { return 444; }

        proxy_method $xhttp_uplink_method;
        proxy_pass http://xhttp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Do not forward the CDN credential to the tunnel process.
        proxy_set_header X-CDN-Secret "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_socket_keepalive on;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        client_max_body_size 0;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store, no-transform" always;
    }

    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

# Optional: keep HTTPS available for direct checks and for providers that fetch
# origin over TLS. The tested Yandex path does not require it.
server {
    listen 443 ssl;
    # `http2 on` needs nginx >= 1.25.1. On older builds use `listen 443 ssl http2;`.
    http2 on;
    # Use the hostname that appears in the certificate. If the CDN fetches
    # origin by a different name, add it here and to the certificate SANs.
    server_name cdn.example.com;

    ssl_certificate     /etc/letsencrypt/live/cdn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.example.com/privkey.pem;

    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    keepalive_requests 100000;
    keepalive_timeout 600s;

    location = /health {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /_cdn_secret_probe {
        access_log off;
        if ($cdn_secret_ok = 0) { return 444; }
        return 204;
    }

    location /api-stream {
        if ($cdn_secret_ok = 0) { return 444; }

        proxy_pass http://xhttp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-CDN-Secret "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_socket_keepalive on;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        client_max_body_size 0;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store, no-transform" always;
    }

    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
