# CDN origin for a VLESS/XHTTP tunnel.
# Replace cdn.example.com and the certificate paths. Keep this file out of the
# public web root and back it up before editing.

upstream xhttp_backend {
    server 127.0.0.1:9081;
    keepalive 32;
}

# The tested CDN edge fetched origin over plain HTTP on port 80, into the
# default server. Keep the catch-all limited to the tunnel path and health.
server {
    # Drop `default_server` if another vhost already owns the default on :80.
    listen 80 default_server;
    server_name _;

    # Header placement base64-encodes the uplink. 3-4 KiB chunks stay well
    # below these buffers; the buffers are insurance against padding growth.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    location /api-stream {
        proxy_pass http://xhttp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 0;
        add_header Cache-Control "no-store, no-transform" always;
    }

    location = /health {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }
}

# Optional: keep HTTPS available for direct checks and providers that fetch
# origin over TLS. The CDN path above does not require it.
server {
    listen 443 ssl;
    # `http2 on` needs nginx >= 1.25.1. On older builds use `listen 443 ssl http2;`.
    http2 on;
    # Use the hostname that appears in the certificate. If the CDN fetches
    # origin by a different name, add it here and to the certificate SANs.
    server_name cdn.example.com;

    ssl_certificate     /etc/letsencrypt/live/cdn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.example.com/privkey.pem;

    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    location /api-stream {
        proxy_pass http://xhttp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 0;
        add_header Cache-Control "no-store, no-transform" always;
    }

    location = /health {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }
}
